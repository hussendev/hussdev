<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03182c"/>
      <stop offset="0.55" stop-color="#02233f"/>
      <stop offset="1" stop-color="#0b3d63"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.75" cy="0.35" r="0.5">
      <stop offset="0" stop-color="#4fb3ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4fb3ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.2" cy="0.8" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.45"/>
